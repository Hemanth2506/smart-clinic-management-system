name: Java Backend CI
on:
  push:
  pull_request:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile Java backend
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw clean compile

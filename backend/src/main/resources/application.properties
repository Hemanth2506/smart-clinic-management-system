spring.application.name=smart-clinic
server.port=8080
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/smartclinic}
spring.datasource.username=${MYSQL_USER:clinic}
spring.datasource.password=${MYSQL_PASSWORD:clinicpass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/smartclinic}
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_IN_PRODUCTION_TO_A_LONG_RANDOM_SECRET_12345678901234567890}

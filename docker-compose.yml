services:
 mysql:
  image: mysql:8.0
  environment:
   MYSQL_ROOT_PASSWORD: root_dev_only
   MYSQL_DATABASE: smartclinic
   MYSQL_USER: clinic
   MYSQL_PASSWORD: clinicpass
  ports: ["3306:3306"]
  volumes:
   - ./database:/docker-entrypoint-initdb.d:ro
 mongo:
  image: mongo:7
  ports: ["27017:27017"]
 app:
  build: .
  depends_on: [mysql,mongo]
  environment:
   MYSQL_URL: jdbc:mysql://mysql:3306/smartclinic
   MYSQL_USER: clinic
   MYSQL_PASSWORD: clinicpass
   MONGO_URI: mongodb://mongo:27017/smartclinic
   JWT_SECRET: CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_IN_REAL_DEPLOYMENTS_123456
  ports: ["8080:8080"]